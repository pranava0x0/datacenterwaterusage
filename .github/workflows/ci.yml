name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: this workflow only checks out the repo and runs tests — it
# needs read access to contents and nothing else. An explicit top-level block
# also overrides any permissive repo/org default GITHUB_TOKEN scope.
permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not moving tags) so a
      # retag/compromise of a tag can't inject code into CI. Comment tracks the
      # human-readable version; re-pin with `gh api repos/<a>/commits/<tag>`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile dashboard
        run: python -m py_compile dashboard.py

      - name: Run tests
        run: python -m pytest -q
