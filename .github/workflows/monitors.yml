name: Status monitors

# Weekly sweep of every record carrying a `monitor` block, so a status change
# (the Ohio general permit finalizing, Virginia's first HB 496 report, an
# eventual NY veto) gets detected rather than rediscovered by a human
# re-running research months later.
#
# Monitors PROPOSE; humans dispose. This workflow never edits a curated
# dataset — it appends to a candidate queue and uploads it for triage.
# See REFRESH.md step 1.
#
# No untrusted event data is interpolated anywhere below: the only expressions
# are `secrets.*` and static config, so there is no workflow-injection surface.
on:
  schedule:
    # 07:23 UTC Mondays. Off the hour and off :00/:30 so this doesn't pile onto
    # the top-of-hour spike every other scheduled job in the world lands on.
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

# Least privilege: reads the repo, writes nothing back. State travels via the
# actions cache and artifacts, so this job never needs contents: write.
permissions:
  contents: read

concurrency:
  # A slow sweep must not overlap the next week's run and double-append.
  group: monitors
  cancel-in-progress: false

jobs:
  sweep:
    name: monitor sweep
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not moving tags) so a retag or tag
      # compromise can't inject code. Re-pin with `gh api repos/<a>/commits/<tag>`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ops state that must survive between weekly runs. It's gitignored
      # (not curated data), so it round-trips through the actions cache —
      # which, unlike artifacts, is designed for cross-run state and needs no
      # prior run-id. The restore-key inherits the most recent cache; the
      # run-id key saves an updated one.
      #
      # BOTH files, not just the fingerprints. Restoring the cache alone would
      # lose untriaged candidates: the prior run already advanced the
      # fingerprint, so an unchanged page emits nothing the next week, the
      # fresh checkout starts with no queue, and the newest artifact silently
      # omits a hit nobody has actioned yet — which then expires with the old
      # artifact. The queue is append-only precisely so pending work survives.
      - name: Restore monitor state from the last sweep
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            data/state/monitor_fingerprints.json
            data/output/monitor_hits.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Sweep
        env:
          # Absent key => the two LegiScan watches report as FAILED rather than
          # skipping quietly. Intentional: a watch that stopped running must not
          # be indistinguishable from a watch reporting no change.
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        # Writes its own $GITHUB_STEP_SUMMARY covering only this run's
        # candidates — the queue on disk is append-only history.
        run: python3 -m scrapers.monitors.run

      # A convenience copy for humans — the cache above is what actually
      # carries pending candidates forward between runs. 90 days is well past
      # any sensible triage lag.
      - name: Upload candidate queue for triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-hits
          path: data/output/monitor_hits.json
          if-no-files-found: ignore
          retention-days: 90
