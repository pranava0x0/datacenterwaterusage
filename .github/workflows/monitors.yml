name: Status monitors

# Weekly sweep of every record carrying a `monitor` block, so a status change
# (the Ohio general permit finalizing, Virginia's first HB 496 report, an
# eventual NY veto) gets detected rather than rediscovered by a human
# re-running research months later.
#
# Monitors PROPOSE; humans dispose. This workflow never edits a curated
# dataset — it appends to a candidate queue and uploads it for triage.
# See REFRESH.md step 1.
#
# No untrusted event data is interpolated anywhere below: the only expressions
# are `secrets.*` and static config, so there is no workflow-injection surface.
on:
  schedule:
    # 07:23 UTC Mondays. Off the hour and off :00/:30 so this doesn't pile onto
    # the top-of-hour spike every other scheduled job in the world lands on.
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

# Least privilege: reads the repo, writes nothing back. State travels via the
# actions cache and artifacts, so this job never needs contents: write.
permissions:
  contents: read
  # Needed only to download a prior run's monitor-hits artifact when the
  # actions cache has been evicted. Still no write scope anywhere.
  actions: read

concurrency:
  # A slow sweep must not overlap the next week's run and double-append.
  group: monitors
  cancel-in-progress: false

jobs:
  sweep:
    name: monitor sweep
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not moving tags) so a retag or tag
      # compromise can't inject code. Re-pin with `gh api repos/<a>/commits/<tag>`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ops state that must survive between weekly runs. It's gitignored
      # (not curated data), so it round-trips through the actions cache —
      # which, unlike artifacts, is designed for cross-run state and needs no
      # prior run-id. The restore-key inherits the most recent cache; the
      # run-id key saves an updated one.
      #
      # BOTH files, not just the fingerprints. Restoring the cache alone would
      # lose untriaged candidates: the prior run already advanced the
      # fingerprint, so an unchanged page emits nothing the next week, the
      # fresh checkout starts with no queue, and the newest artifact silently
      # omits a hit nobody has actioned yet — which then expires with the old
      # artifact. The queue is append-only precisely so pending work survives.
      - name: Restore monitor state from the last sweep
        id: state
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            data/state/monitor_fingerprints.json
            data/output/monitor_hits.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      # One-time migration path. The version of this workflow on main keys its
      # cache `monitor-fingerprints-` and publishes only `monitor-hits`, so
      # after this rename neither the new cache nor the new artifact exists and
      # the recovery below would call it a cold start and discard real state.
      # Safe to delete once a run has published `monitor-state`.
      - name: Restore legacy fingerprint cache
        if: steps.state.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: data/state/monitor_fingerprints.json
          key: monitor-fingerprints-
          restore-keys: monitor-fingerprints-

      # The actions cache is a CACHE, not storage: GitHub evicts entries unused
      # for 7 days and under repo cache pressure. One skipped week would drop
      # the queue, the next run would re-baseline everything, and a curator
      # following REFRESH.md would download a fresh artifact silently missing
      # every untriaged hit. Artifacts are retained 90 days, so on a cache miss
      # fall back to the last run that published one.
      # The actions cache is a CACHE, not storage: GitHub evicts entries unused
      # for 7 days and under repo cache pressure. On a miss, rebuild from the
      # last published artifact (90-day retention).
      #
      # This step FAILS rather than continuing on a partial recovery. A warning
      # is not enough: the sweep would baseline a page that had actually
      # changed, and the upload steps at the end would then overwrite the good
      # cache and artifact with that empty state — turning a recoverable blip
      # into permanent loss of a real status change. Better a red run somebody
      # investigates than a green one that quietly discarded the finding.
      #
      # A genuine first run (no prior artifact at all) is not a failure: there
      # is nothing to recover and baselining is the correct behaviour.
      - name: Recover monitor state if the cache missed
        if: steps.state.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/output data/state
          find_run() {  # $1 = artifact name
            gh run list --workflow monitors.yml --status success \
              --limit 20 --json databaseId --jq '.[].databaseId' \
              | while read -r id; do
                  if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                       --jq '.artifacts[].name' 2>/dev/null | grep -qx "$1"; then
                    echo "$id"; break
                  fi
                done
          }

          run_id=$(find_run monitor-state)
          artifact=monitor-state
          if [ -z "${run_id:-}" ]; then
            # Legacy name, published by the pre-rename workflow.
            run_id=$(find_run monitor-hits)
            artifact=monitor-hits
          fi

          if [ -z "${run_id:-}" ]; then
            echo "No prior monitor-state or monitor-hits artifact — genuine cold start."
            exit 0
          fi

          echo "Recovering from run $run_id (artifact: $artifact)"
          dest=data
          [ "$artifact" = "monitor-hits" ] && dest=data/output
          if ! gh run download "$run_id" --name "$artifact" --dir "$dest"; then
            echo "::error::Recovery download failed for run $run_id. Refusing to" \
                 "sweep: baselining now would overwrite the recoverable queue" \
                 "and fingerprints with empty state."
            exit 1
          fi

          # Completeness is judged on what is on disk after EVERY fallback —
          # the legacy cache step above may already have supplied the
          # fingerprints that a monitor-hits artifact does not carry.
          missing=""
          [ -s data/output/monitor_hits.json ] || missing="$missing data/output/monitor_hits.json"
          [ -s data/state/monitor_fingerprints.json ] || missing="$missing data/state/monitor_fingerprints.json"
          if [ -n "$missing" ]; then
            echo "::error::Recovery incomplete — missing:$missing. Refusing to" \
                 "sweep: a changed page would be recorded as a first observation" \
                 "and the good state overwritten."
            exit 1
          fi
          echo "Recovered both state files."

      - name: Sweep
        env:
          # Absent key => the two LegiScan watches report as FAILED rather than
          # skipping quietly. Intentional: a watch that stopped running must not
          # be indistinguishable from a watch reporting no change.
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        # Writes its own $GITHUB_STEP_SUMMARY covering only this run's
        # candidates — the queue on disk is append-only history.
        run: python3 -m scrapers.monitors.run

      # A convenience copy for humans — the cache above is what actually
      # carries pending candidates forward between runs. 90 days is well past
      # any sensible triage lag.
      - name: Upload candidate queue for triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-hits
          path: data/output/monitor_hits.json
          if-no-files-found: ignore
          retention-days: 90

      # Durable copy of BOTH state files, used only to rebuild after a cache
      # eviction. Restoring the queue without the fingerprints would make the
      # next sweep treat every page as a first observation, so a real change
      # would be logged as "baselined" and the summary would read "nothing to
      # triage" — a silent miss dressed as a quiet week.
      - name: Upload full monitor state for recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-state
          path: |
            data/output/monitor_hits.json
            data/state/monitor_fingerprints.json
          if-no-files-found: ignore
          retention-days: 90
