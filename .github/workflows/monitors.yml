name: Status monitors

# Weekly sweep of every record carrying a `monitor` block, so a status change
# (the Ohio general permit finalizing, Virginia's first HB 496 report, an
# eventual NY veto) gets detected rather than rediscovered by a human
# re-running research months later.
#
# Monitors PROPOSE; humans dispose. This workflow never edits a curated
# dataset — it appends to a candidate queue and uploads it for triage.
# See REFRESH.md step 1.
#
# No untrusted event data is interpolated anywhere below: the only expressions
# are `secrets.*` and static config, so there is no workflow-injection surface.
on:
  schedule:
    # 07:23 UTC Mondays. Off the hour and off :00/:30 so this doesn't pile onto
    # the top-of-hour spike every other scheduled job in the world lands on.
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

# Least privilege: reads the repo, writes nothing back. State travels via the
# actions cache and artifacts, so this job never needs contents: write.
permissions:
  contents: read

concurrency:
  # A slow sweep must not overlap the next week's run and double-append.
  group: monitors
  cancel-in-progress: false

jobs:
  sweep:
    name: monitor sweep
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not moving tags) so a retag or tag
      # compromise can't inject code. Re-pin with `gh api repos/<a>/commits/<tag>`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The fingerprint cache is what makes a sweep report CHANGES rather than
      # re-baselining everything every week. It's gitignored (ops state, not
      # curated data), so it round-trips through the actions cache — which,
      # unlike artifacts, is designed for cross-run state and needs no prior
      # run-id. The restore-key lets each run inherit the most recent cache and
      # save an updated one under a fresh key.
      - name: Restore fingerprints from the last sweep
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: data/state/monitor_fingerprints.json
          key: monitor-fingerprints-${{ github.run_id }}
          restore-keys: monitor-fingerprints-

      - name: Sweep
        env:
          # Absent key => the two LegiScan watches report as FAILED rather than
          # skipping quietly. Intentional: a watch that stopped running must not
          # be indistinguishable from a watch reporting no change.
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: python3 -m scrapers.monitors.run

      # The queue is the human work product. 90 days is well past any sensible
      # triage lag, and it is append-only within a run.
      - name: Upload candidate queue for triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-hits
          path: data/output/monitor_hits.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Summarize
        if: always()
        run: |
          echo "### Monitor sweep" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/output/monitor_hits.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          rows = json.loads(Path("data/output/monitor_hits.json").read_text())["candidates"]
          changed = [c for c in rows if c.get("previous_fingerprint") and c.get("fingerprint")]
          failed = [c for c in rows if not c.get("fingerprint")]
          print(f"- {len(changed)} changed, {len(failed)} failed, {len(rows)} total queued")
          for c in changed:
              print(f"  - **{c['record_id']}** — {c.get('note') or c['summary']}")
          for c in failed:
              print(f"  - x {c['record_id']} — {c['summary']}")
          print()
          print("Download the `monitor-hits` artifact to triage. Monitors propose; a curator decides.")
          PY
          else
            echo "- no candidate queue written" >> "$GITHUB_STEP_SUMMARY"
          fi
