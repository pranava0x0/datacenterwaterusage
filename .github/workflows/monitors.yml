name: Status monitors

# Weekly sweep of every record carrying a `monitor` block, so a status change
# (the Ohio general permit finalizing, Virginia's first HB 496 report, an
# eventual NY veto) gets detected rather than rediscovered by a human
# re-running research months later.
#
# Monitors PROPOSE; humans dispose. This workflow commits ops state only — the
# candidate queue, the fingerprints and the page snapshots they diff against. It never edits a curated dataset
# under data/reference/, which a test enforces. See REFRESH.md step 1.
#
# STATE LIVES IN GIT, ON PURPOSE. An earlier version kept it in the actions
# cache with artifact fallbacks, a legacy-migration path and a completeness
# guard: five steps and ~56 lines of shell whose only job was not losing a
# small JSON file. Six consecutive review rounds found defects in it — cache
# eviction, half-restored state, a rename that orphaned everything, and a
# `cache-hit` condition that is false on every run because the key embeds
# run_id. Git is already durable append-only storage, and CLAUDE.md section 3
# already makes append-only the project's data model. Committing the file
# deletes the whole failure class instead of guarding each instance of it.
#
# No untrusted event data is interpolated below: the only expressions are
# `secrets.*` and static config, so there is no workflow-injection surface.
on:
  schedule:
    # 07:23 UTC Mondays. Off the hour and off :00/:30 so this doesn't pile onto
    # the top-of-hour spike every other scheduled job in the world lands on.
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

# contents: write is required to commit the queue, and is the only permission
# granted. The cache-plus-artifacts alternative needed `actions: read` anyway
# and cost the reliability documented above.
permissions:
  contents: write

concurrency:
  # A slow sweep must not overlap the next week's run and race the commit.
  group: monitors
  cancel-in-progress: false

jobs:
  sweep:
    name: monitor sweep
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not moving tags) so a retag or tag
      # compromise can't inject code. Re-pin with `gh api repos/<a>/commits/<tag>`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The checkout already carries both state files, so there is nothing to
      # restore and nothing that can be half-restored.
      - name: Sweep
        env:
          # Absent key => the LegiScan watches report as FAILED rather than
          # skipping quietly. Intentional: a watch that stopped running must not
          # be indistinguishable from a watch reporting no change.
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        # Writes its own $GITHUB_STEP_SUMMARY covering only this run's
        # candidates — the queue on disk is append-only history.
        run: python3 -m scrapers.monitors.run

      - name: Commit updated monitor state
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths: the sweep must never be able to commit a curated
          # dataset, even if some future change writes to one by mistake.
          # Add only files that exist: `git add` on a missing path aborts
          # under `set -e`, and a sweep with nothing to queue writes no queue.
          for f in data/output/monitor_hits.json \
                   data/state/monitor_fingerprints.json \
                   data/state/monitor_fingerprints_snapshots.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No state change this run."
            exit 0
          fi
          git commit -m "monitors: weekly sweep state [skip ci]"
          # Rebase before pushing: a human may have committed a triage edit
          # while this ran. Concurrency prevents overlapping sweeps, not humans.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
