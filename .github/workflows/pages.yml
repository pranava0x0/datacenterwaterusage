name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Assemble site
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not moving tags) so a tag
      # retag/compromise can't inject code into this write-capable deploy
      # pipeline. Comment tracks the version; re-pin via
      # `gh api repos/<action>/commits/<tag> --jq .sha`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          set -eux
          # Only the deps build_site.py needs to import dashboard.py and render
          # markdown — not the full scraper stack — kept version-matched to
          # requirements.txt.
          python -m pip install --upgrade pip
          pip install streamlit==1.50.0 plotly==6.6.0 pandas==2.3.3 markdown==3.9

      - name: Build static site
        run: |
          set -eux
          python build_site.py
          rm -rf _site
          mkdir -p _site
          # Deploy every file build_site.py writes, not just the page. Until
          # 2026-08-24 this copied index.html alone, which silently 404'd the
          # llms.txt the page links to; graph-data.json (the Explore tab's
          # data, fetched on first activation) would have failed the same way.
          # Copying the directory rather than a hand-kept list means a future
          # output cannot be forgotten here.
          cp pages/*.* _site/
          for f in index.html graph-data.json llms.txt; do
            test -s "_site/$f" || { echo "missing or empty: _site/$f" >&2; exit 1; }
          done

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
