name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Assemble site
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not moving tags) so a tag
      # retag/compromise can't inject code into this write-capable deploy
      # pipeline. Comment tracks the version; re-pin via
      # `gh api repos/<action>/commits/<tag> --jq .sha`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Assemble _site/
        run: |
          set -eux
          mkdir -p _site/utils _site/data/output _site/data/reference
          cp pages/index.html _site/index.html
          cp dashboard.py _site/dashboard.py
          cp utils/__init__.py _site/utils/__init__.py
          cp utils/device.py _site/utils/device.py
          cp data/output/results.csv _site/data/output/results.csv
          cp data/output/results.json _site/data/output/results.json
          cp data/reference/legislation.json _site/data/reference/legislation.json
          cp data/reference/company_water_claims.json _site/data/reference/company_water_claims.json
          cp data/reference/cwa_investigations.json _site/data/reference/cwa_investigations.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
