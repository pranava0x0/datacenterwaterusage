name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Assemble site
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not moving tags) so a tag
      # retag/compromise can't inject code into this write-capable deploy
      # pipeline. Comment tracks the version; re-pin via
      # `gh api repos/<action>/commits/<tag> --jq .sha`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          set -eux
          # Only the deps build_site.py needs to import dashboard.py and render
          # markdown — not the full scraper stack — kept version-matched to
          # requirements.txt. The static HTML is self-contained (data embedded),
          # so nothing else is copied into _site/.
          python -m pip install --upgrade pip
          pip install streamlit==1.50.0 plotly==6.6.0 pandas==2.3.3 markdown==3.9

      - name: Build static site
        run: |
          set -eux
          python build_site.py
          mkdir -p _site
          cp pages/index.html _site/index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
